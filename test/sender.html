<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Screen Sender</title>

    <!--
        PeerJS'i CDN üzerinden yüklüyoruz.

        PeerJS:
        - Peer ID oluşturuyor
        - Signaling işlemini yapıyor
        - WebRTC bağlantısını bizim için yönetiyor
    -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 30px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: #1d1d1d;
            padding: 25px;
            border-radius: 12px;
        }

        button,
        select {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            cursor: pointer;
        }

        #shareButton {
            background: #2d8cff;
            color: white;
        }

        #link {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
        }

        #status {
            margin-top: 15px;
            color: #8ee68e;
        }

        video {
            width: 100%;
            margin-top: 20px;
            background: black;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Screen Sender</h1>

    <p>
        Peer ID:
        <strong id="peerId">Bağlanıyor...</strong>
    </p>

    <p>
        Receiver Link:
    </p>

    <input id="link" readonly>

    <hr>

    <h3>Yayın Ayarları</h3>

    <label>
        Çözünürlük:
    </label>

    <select id="quality">
        <option value="720">720p</option>
        <option value="1080">1080p</option>
        <option value="1440">1440p / 2K</option>
        <option value="2160">2160p / 4K</option>
    </select>

    <br>

    <label>
        FPS:
    </label>

    <select id="fps">
        <option value="30">30 FPS</option>
        <option value="60">60 FPS</option>
    </select>

    <br>

    <button id="shareButton">
        Ekran Paylaşımını Başlat
    </button>

    <p id="status">
        PeerJS'e bağlanılıyor...
    </p>

    <!--
        Sender kendi ekranını burada önizleyebilir.
        Bu video remote'a gönderilen stream'in aynısını gösterir.
    -->
    <video id="preview" autoplay muted playsinline></video>

</div>


<script>

    /*
     * ============================================================
     * 1. PEER OLUŞTUR
     * ============================================================
     *
     * new Peer() dediğimizde PeerJS Cloud'a bağlanılır.
     *
     * PeerJS bize otomatik olarak benzersiz bir Peer ID verir.
     *
     * Örneğin:
     *
     *     abc123XYZ
     *
     * Receiver bu ID'yi kullanarak bize ulaşacak.
     */
    const peer = new Peer();


    /*
     * ============================================================
     * 2. GİZLİ TOKEN OLUŞTUR
     * ============================================================
     *
     * Burada normal Math.random() kullanmıyoruz.
     *
     * crypto.getRandomValues() browser'ın cryptographically
     * secure random generator'ını kullanır.
     *
     * 32 byte = 256 bit rastgele veri.
     *
     * Bu token'ın tahmin edilmesi pratik olarak mümkün değildir.
     */
    function createSecureToken() {

        const bytes = new Uint8Array(32);

        crypto.getRandomValues(bytes);

        /*
         * Uint8Array'i hexadecimal string'e çeviriyoruz.
         *
         * Örnek:
         *
         * a8f3c9...
         */
        return Array.from(bytes)
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }


    /*
     * Her sender sayfası açıldığında yeni bir token oluşturuyoruz.
     */
    const accessToken = createSecureToken();


    /*
     * ============================================================
     * 3. PEER AÇILDIĞINDA LINK OLUŞTUR
     * ============================================================
     *
     * peer.id ancak "open" eventinden sonra hazır olur.
     */
    peer.on("open", (id) => {

        document.getElementById("peerId").textContent = id;

        /*
         * Receiver sayfasının URL'sine:
         *
         * id   = sender'ın Peer ID'si
         * pass = 256-bit secret
         *
         * koyuyoruz.
         */
        const receiverUrl =
            new URL("receiver.html", window.location.href);

        receiverUrl.searchParams.set("id", id);
        receiverUrl.searchParams.set("pass", accessToken);

        document.getElementById("link").value =
            receiverUrl.toString();

        document.getElementById("status").textContent =
            "Hazır. Receiver bağlantısı bekleniyor.";
    });


    /*
     * ============================================================
     * 4. GELEN WEBRTC ÇAĞRILARINI DİNLE
     * ============================================================
     *
     * Receiver:
     *
     * peer.call(senderId, ...)
     *
     * yaptığında bu event tetiklenir.
     */
    peer.on("call", (call) => {

        document.getElementById("status").textContent =
            "Bir bağlantı isteği geldi. Token kontrol ediliyor...";


        /*
         * Receiver'ın gönderdiği metadata'yı alıyoruz.
         *
         * Receiver tarafında:
         *
         * {
         *     pass: "..."
         * }
         *
         * gönderilecek.
         */
        const receivedToken =
            call.metadata?.pass;


        /*
         * ========================================================
         * 5. TOKEN KONTROLÜ
         * ========================================================
         *
         * Token eşleşmiyorsa:
         *
         * - answer() çağırmıyoruz
         * - WebRTC bağlantısı kurulmuyor
         * - ekran stream'i gönderilmiyor
         */
        if (
            typeof receivedToken !== "string" ||
            receivedToken !== accessToken
        ) {

            document.getElementById("status").textContent =
                "Reddedildi: geçersiz erişim anahtarı.";

            /*
             * Çağrıyı kapatıyoruz.
             */
            call.close();

            return;
        }


        /*
         * Token doğru.
         *
         * Ancak burada henüz ekran paylaşımı başlatmak
         * zorunda değiliz.
         *
         * Önce kullanıcıdan ekran izni alınmasını bekleyebiliriz.
         */
        if (!screenStream) {

            document.getElementById("status").textContent =
                "Bağlantı doğrulandı. Önce ekran paylaşımını başlat.";

            /*
             * Bu çağrıyı şimdilik bekletiyoruz.
             *
             * Kullanıcı Screen Share butonuna bastığında
             * pendingCall üzerinden cevap vereceğiz.
             */
            pendingCall = call;

            return;
        }


        /*
         * Zaten ekran stream'i varsa direkt cevap ver.
         */
        acceptCall(call);
    });


    /*
     * Şu anda aktif ekran stream'i.
     */
    let screenStream = null;


    /*
     * Doğrulanmış fakat ekran paylaşımı henüz başlamadığı
     * için bekletilen WebRTC çağrısı.
     */
    let pendingCall = null;


    /*
     * ============================================================
     * 6. WEBRTC ÇAĞRISINI KABUL ET
     * ============================================================
     */
    function acceptCall(call) {

        /*
         * Receiver bize bir stream göndermiyor.
         *
         * Bu yüzden answer() içine bizim ekran stream'imizi
         * veriyoruz.
         *
         * Böylece bağlantı tek yönlü:
         *
         * Sender -> Receiver
         */
        call.answer(screenStream);


        document.getElementById("status").textContent =
            "Receiver'a ekran gönderiliyor.";


        /*
         * Bağlantı kapandığında durum bilgisini güncelle.
         */
        call.on("close", () => {

            document.getElementById("status").textContent =
                "Receiver bağlantısı kapattı.";
        });


        call.on("error", (error) => {

            console.error(error);

            document.getElementById("status").textContent =
                "WebRTC hatası.";
        });
    }


    /*
     * ============================================================
     * 7. EKRAN PAYLAŞIMINI BAŞLAT
     * ============================================================
     */
    document
        .getElementById("shareButton")
        .addEventListener("click", async () => {

            try {

                /*
                 * Kullanıcının seçtiği kaliteyi alıyoruz.
                 */
                const quality =
                    Number(
                        document.getElementById("quality").value
                    );


                /*
                 * Kullanıcının seçtiği FPS.
                 */
                const fps =
                    Number(
                        document.getElementById("fps").value
                    );


                /*
                 * ====================================================
                 * getDisplayMedia
                 * ====================================================
                 *
                 * Browser ekran paylaşım penceresini açar.
                 *
                 * width / height / frameRate değerleri burada
                 * istediğimiz kaliteyi browser'a bildirir.
                 *
                 * Browser'ın ekranı / işletim sistemi / tarayıcı
                 * kısıtlamaları nedeniyle gerçek değer her zaman
                 * tam olarak bu olmayabilir.
                 */
                screenStream =
                    await navigator.mediaDevices.getDisplayMedia({

                        video: {

                            width: {
                                ideal: quality
                            },

                            height: {
                                ideal: quality * 9 / 16
                            },

                            frameRate: {
                                ideal: fps,
                                max: fps
                            }
                        },

                        /*
                         * Biz sadece ekran görüntüsü istiyoruz.
                         *
                         * Mikrofon veya sistem sesi istemiyoruz.
                         */
                        audio: false
                    });


                /*
                 * Sender'ın kendi önizlemesini başlat.
                 */
                const preview =
                    document.getElementById("preview");

                preview.srcObject = screenStream;


                document.getElementById("status").textContent =
                    "Ekran paylaşımı başladı.";


                /*
                 * ====================================================
                 * BEKLEYEN WEBRTC ÇAĞRISI VARSA CEVAPLA
                 * ====================================================
                 */
                if (pendingCall) {

                    const call = pendingCall;

                    pendingCall = null;

                    acceptCall(call);
                }


                /*
                 * Kullanıcı browser'ın kendi ekran paylaşım
                 * penceresinden "Stop Sharing" yaparsa bu event
                 * tetiklenir.
                 */
                const videoTrack =
                    screenStream.getVideoTracks()[0];

                videoTrack.addEventListener("ended", () => {

                    document.getElementById("status").textContent =
                        "Ekran paylaşımı durduruldu.";

                    screenStream = null;
                });


            } catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Ekran paylaşımı başlatılamadı: " +
                    error.message;
            }
        });


    /*
     * ============================================================
     * PEERJS HATALARI
     * ============================================================
     */
    peer.on("error", (error) => {

        console.error("PeerJS Error:", error);

        document.getElementById("status").textContent =
            "PeerJS hatası: " + error.type;
    });

</script>

</body>
</html>
