<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekran Paylaşımı - Gönderici</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; background:#111; color:#eee; }
  h1 { font-size: 20px; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; background:#222; color:#eee; border:1px solid #444; border-radius:4px; }
  button { padding: 8px 14px; margin: 6px 6px 6px 0; border-radius:4px; border:1px solid #444; background:#2563eb; color:#fff; cursor:pointer; }
  button:disabled { background:#555; cursor:not-allowed; }
  select { padding:6px; background:#222; color:#eee; border:1px solid #444; border-radius:4px; }
  #linkBox, #controls { margin-top:16px; padding:12px; background:#1b1b1b; border-radius:8px; }
  video { border-radius:8px; margin-top:12px; background:#000; }
  #log { margin-top:16px; font-size:12px; color:#999; max-height:160px; overflow-y:auto; }
  label { margin-right:12px; }
</style>
</head>
<body>

<h1>📡 Gönderici (Sender)</h1>
<div id="status">Bağlanıyor...</div>

<div id="linkBox" style="display:none">
  <p>Bu linki alıcı ile paylaşın (id + şifre içinde gömülü):</p>
  <input type="text" id="shareLink" readonly>
  <button onclick="copyLink()">Linki Kopyala</button>
</div>

<div id="controls" style="display:none">
  <label>Çözünürlük:
    <select id="resolution">
      <option value="1280x720">720p</option>
      <option value="1920x1080" selected>1080p</option>
      <option value="3840x2160">4K</option>
    </select>
  </label>
  <label>FPS:
    <select id="fps">
      <option value="30" selected>30</option>
      <option value="60">60</option>
    </select>
  </label>
  <br>
  <button id="shareBtn" onclick="startShare()">Ekranı Paylaş</button>
  <button id="stopBtn" onclick="stopShare()" disabled>Paylaşımı Durdur</button>
</div>

<video id="preview" autoplay muted playsinline style="width:100%;max-width:640px;display:none"></video>
<div id="log"></div>

<!-- PeerJS: WebRTC sinyalleşmesini (signaling) bizim yerimize halleden kütüphane.
     Kendi sinyalleşme sunucumuzu yazmamıza gerek kalmıyor, PeerJS'in ücretsiz
     bulut sunucusunu (0.peerjs.com) kullanıyoruz. -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ---- Durum değişkenleri ----
let localStream = null;              // getDisplayMedia'dan gelen ekran akışı
let activeCalls = [];                // aktif WebRTC call'ları (birden fazla receiver olabilir)
let SECRET_PASS = null;              // tarayıcıda üretilen, kimseyle paylaşılmayan gizli şifre
let pendingVerifiedReceivers = [];   // parolayı doğrulamış ama henüz aranmamış receiver id'leri

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ---- Güvenli şifre üretimi ----
// Math.random() kriptografik olarak güvenli değildir (tahmin edilebilir).
// crypto.getRandomValues tarayıcının kendi güvenli rastgele sayı üretecini
// kullanır. 16 byte = 128 bit entropi, brute-force ile bulunması pratikte
// imkansız bir şifre üretir.
function generateSecurePassword(byteLength = 16) {
  const bytes = new Uint8Array(byteLength);
  crypto.getRandomValues(bytes);
  // base64url'e çeviriyoruz: + / = karakterleri URL'de sorun çıkarabilir,
  // bu yüzden - _ ile değiştirip = dolgusunu kaldırıyoruz.
  return btoa(String.fromCharCode(...bytes))
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/, '');
}

// ---- PeerJS bağlantısını başlat ----
// new Peer() içine id vermezsek, PeerJS sunucusu bize otomatik benzersiz
// bir id atar (biz kendimiz id üretmiyoruz, senaryoda istenen buydu).
const peer = new Peer();

peer.on('open', (id) => {
  document.getElementById('status').textContent = '✅ Bağlandı. ID: ' + id;

  SECRET_PASS = generateSecurePassword();

  // Linki oluştur: receiver.html'in aynı klasörde olduğunu varsayıyoruz.
  // id ve pass'i query parametresi olarak gömüyoruz, receiver bunları
  // linkten parse edecek.
  const receiverUrl = new URL('receiver.html', window.location.href);
  receiverUrl.searchParams.set('id', id);
  receiverUrl.searchParams.set('pass', SECRET_PASS);

  document.getElementById('shareLink').value = receiverUrl.toString();
  document.getElementById('linkBox').style.display = 'block';
  document.getElementById('controls').style.display = 'block';
  log('Peer ID alındı, şifre üretildi.');
});

peer.on('error', (err) => {
  log('Peer hatası: ' + err.type);
  document.getElementById('status').textContent = '❌ Hata: ' + err.type;
});

// ---- Receiver'dan gelen parola doğrulama bağlantısını dinle ----
// Akış: receiver bize bir DataConnection açar ve {type:'auth', pass:'...'}
// mesajı yollar. Biz kendi SECRET_PASS'imizle karşılaştırırız.
// - Doğruysa: 'auth-ok' döneriz ve (ekran paylaşımı başlamışsa hemen,
//   başlamamışsa startShare() çağrıldığında) o receiver'a WebRTC call açarız.
// - Yanlışsa: 'auth-fail' döneriz ve bağlantıyı kapatırız; hiçbir zaman
//   media call başlatılmaz, yani şifre yanlışsa ekran ASLA paylaşılmaz.
peer.on('connection', (conn) => {
  conn.on('open', () => log('Gelen bağlantı isteği: ' + conn.peer));

  conn.on('data', (data) => {
    if (!data || data.type !== 'auth') return;

    if (data.pass === SECRET_PASS) {
      log('Parola doğru: ' + conn.peer);
      conn.send({ type: 'auth-ok' });

      if (localStream) {
        callReceiver(conn.peer);
      } else {
        // Ekran paylaşımı henüz başlamadıysa doğrulanmış receiver'ı
        // bekletiyoruz, startShare() çalışınca otomatik aranacak.
        pendingVerifiedReceivers.push(conn.peer);
        log('Paylaşım henüz başlamadı, receiver bekleme listesine eklendi.');
      }
    } else {
      log('Parola YANLIŞ, reddedildi: ' + conn.peer);
      conn.send({ type: 'auth-fail' });
      setTimeout(() => conn.close(), 200);
    }
  });
});

function callReceiver(receiverId) {
  if (!localStream) return;
  const call = peer.call(receiverId, localStream);
  activeCalls.push(call);
  call.on('close', () => log('Bağlantı kapandı: ' + receiverId));
  call.on('error', (e) => log('Call hatası: ' + e));
  log('Yayın başlatıldı → ' + receiverId);
}

// ---- Ekran yakalama ----
async function startShare() {
  const [w, h] = document.getElementById('resolution').value.split('x').map(Number);
  const fps = Number(document.getElementById('fps').value);

  try {
    // ideal değerler tarayıcıya bir "hedef" olarak veriliyor; donanım/tarayıcı
    // desteklemezse otomatik daha düşük bir değere düşebilir, bu normaldir.
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        width: { ideal: w },
        height: { ideal: h },
        frameRate: { ideal: fps, max: fps }
      },
      audio: false
    });

    const preview = document.getElementById('preview');
    preview.srcObject = localStream;
    preview.style.display = 'block';

    document.getElementById('shareBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    log(`Ekran paylaşımı başladı (${w}x${h} @ ${fps}fps)`);

    // Kullanıcı tarayıcının kendi "paylaşımı durdur" arayüzünden durdurursa
    // video track 'ended' event'i fırlatır, biz de temizliği tetikleriz.
    localStream.getVideoTracks()[0].addEventListener('ended', stopShare);

    // Daha önce doğrulanmış ama bekletilen receiver'lar varsa şimdi ara.
    pendingVerifiedReceivers.forEach(callReceiver);
    pendingVerifiedReceivers = [];

  } catch (err) {
    log('Ekran paylaşımı başlatılamadı: ' + err.message);
  }
}

function stopShare() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  activeCalls.forEach(c => c.close());
  activeCalls = [];
  document.getElementById('preview').style.display = 'none';
  document.getElementById('shareBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  log('Ekran paylaşımı durduruldu.');
}

function copyLink() {
  const input = document.getElementById('shareLink');
  input.select();
  navigator.clipboard.writeText(input.value);
  log('Link kopyalandı.');
}
</script>
</body>
</html>
